<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="Titulo">
        <img src="Assets/Sin título-1.png" class="animar-imagen">
    </div>

    <div class="Btn-inicio-cont">
        <button class="Btn-inicio-cont-bt" id="btn-comenzar">
            <img src="Assets/Boton.png" alt="">
        </button>
    </div>

    <div class="btn-gestion">
        <a href="Registrar_Preguntas/index.html">Registrar Preguntas</a>
        <a href="Gestionar_Preguntas/">Gestiona Preguntas</a>
    </div>

    <div id="status-modal" class="status-modal" aria-hidden="true">
        <div class="status-modal__overlay" data-close-modal="true"></div>
        <div class="status-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="status-modal-title">
            <div class="status-modal__header">
                <h2 id="status-modal-title" class="status-modal__title"></h2>
                <button id="status-modal-close" class="status-modal__close" aria-label="Cerrar modal">x</button>
            </div>
            <p id="status-modal-message" class="status-modal__message"></p>
            <ul id="status-modal-list" class="status-modal__list"></ul>
            <div class="status-modal__actions">
                <button id="status-modal-btn" class="status-modal__btn">Aceptar</button>
            </div>
        </div>
    </div>

    <script>
        const modal = document.getElementById('status-modal');
        const modalTitle = document.getElementById('status-modal-title');
        const modalMessage = document.getElementById('status-modal-message');
        const modalList = document.getElementById('status-modal-list');
        const modalBtn = document.getElementById('status-modal-btn');
        const modalClose = document.getElementById('status-modal-close');

        function abrirModal({ titulo, mensaje, items = [] }) {
            modalTitle.textContent = titulo;
            modalMessage.textContent = mensaje;
            modalList.innerHTML = '';

            if (items.length > 0) {
                modalList.style.display = 'grid';
                items.forEach(item => {
                    const li = document.createElement('li');
                    if (typeof item === 'string') {
                        li.textContent = item;
                        li.classList.add('status-item', 'status-item--low');
                    } else {
                        li.textContent = item.texto;
                        li.classList.add('status-item', `status-item--${item.estado}`);
                    }
                    modalList.appendChild(li);
                });
            } else {
                modalList.style.display = 'none';
            }

            modal.classList.add('is-open');
            modal.setAttribute('aria-hidden', 'false');
            modalBtn.focus();
        }

        function cerrarModal() {
            modal.classList.remove('is-open');
            modal.setAttribute('aria-hidden', 'true');
        }

        modal.addEventListener('click', (e) => {
            if (e.target.dataset.closeModal === 'true') {
                cerrarModal();
            }
        });

        modalBtn.addEventListener('click', cerrarModal);
        modalClose.addEventListener('click', cerrarModal);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('is-open')) {
                cerrarModal();
            }
        });

        document.getElementById('btn-comenzar').addEventListener('click', () => {
            fetch('/conteo-preguntas')
                .then(res => res.json())
                .then(conteo => {
                    const niveles = [
                        { clave: 'facil', etiqueta: 'Fáciles' },
                        { clave: 'intermedio', etiqueta: 'Intermedias' },
                        { clave: 'dificil', etiqueta: 'Difíciles' }
                    ];

                    const faltan = [];

                    niveles.forEach(nivel => {
                        const valor = Number(conteo[nivel.clave] || 0);

                        if (valor < 10) {
                            let estado = 'low';
                            let leyenda = 'faltan varias';

                            if (valor >= 8) {
                                estado = 'high';
                                leyenda = 'casi listo';
                            } else if (valor >= 5) {
                                estado = 'medium';
                                leyenda = 'buen avance';
                            }

                            faltan.push({
                                texto: `${nivel.etiqueta}: ${valor}/10 (${leyenda})`,
                                estado
                            });
                        }
                    });

                    if (faltan.length > 0) {
                        abrirModal({
                            titulo: 'No puedes comenzar',
                            mensaje: 'Aun faltan preguntas para iniciar una partida completa. Aqui va tu progreso:',
                            items: faltan
                        });
                    } else {
                        window.location.href = "Pre-Inicio/index.html";
                    }
                })
                .catch(err => {
                    console.error("Error al verificar preguntas:", err);
                    abrirModal({
                        titulo: 'Error de conexion',
                        mensaje: 'No se pudo verificar la base de datos. Revisa que Docker y MariaDB esten arriba.'
                    });
                });
        });
    </script>


    <script>
        const canciones = [
            "/Assets/Musica/The Legend of Zelda The Wind Waker HD OST 'Outset Island' - Rabbit OST.mp3",
            "/Assets/Musica/Lyn Inaizumi - Tokyo Daylight.mp3",
            "/Assets/Musica/ATLUS Sound Team - Phantom.mp3",
            "/Assets/Musica/ATLUS Sound Team - Have a Short Rest.mp3",
            "/Assets/Musica/ATLUS Sound Team - King, Queen, and Slaves -another version-.mp3",
            "/Assets/Musica/Naruto OST 2 - Afternoon of Konoha - ostdelta1.mp3",
        ];

        let musica;
        let source;
        let cancionActual;

        function obtenerCancionAleatoria(actual) {
            let nueva;
            do {
                nueva = canciones[Math.floor(Math.random() * canciones.length)];
            } while (canciones.length > 1 && nueva === actual);
            return nueva;
        }

        function iniciarMusica() {
            musica = document.createElement("audio");
            musica.autoplay = true;
            musica.loop = false;
            musica.volume = 1.0;

            cancionActual = obtenerCancionAleatoria(null);
            source = document.createElement("source");
            source.src = cancionActual;
            source.type = "audio/mpeg";

            musica.appendChild(source);
            document.body.appendChild(musica);

            musica.addEventListener("ended", () => {
                cancionActual = obtenerCancionAleatoria(cancionActual);
                source.src = cancionActual;
                musica.load();
                musica.play();
            });
        }

        // Si ya se autorizó en esta sesión, reproducimos directamente
        if (sessionStorage.getItem("musicaActivada") === "true") {
            iniciarMusica();
        } else {
            // Esperamos primer clic del usuario
            document.addEventListener('click', () => {
                iniciarMusica();
                sessionStorage.setItem("musicaActivada", "true");
            }, { once: true });
        }

        // Fade-out al salir
        document.querySelectorAll("a").forEach(link => {
            link.addEventListener("click", function (e) {
                e.preventDefault();
                const href = this.href;

                if (!musica) {
                    window.location.href = href;
                    return;
                }

                let volume = musica.volume;
                const fade = setInterval(() => {
                    if (volume > 0.05) {
                        volume -= 0.05;
                        musica.volume = volume;
                    } else {
                        clearInterval(fade);
                        musica.pause();
                        window.location.href = href;
                    }
                }, 50);
            });
        });
    </script>
</body>

</html>
